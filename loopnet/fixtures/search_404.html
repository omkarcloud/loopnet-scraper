    <style>
        .error-404 .wrap {
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
            padding: 48px 16px;
        }

        /*
            The sign image flows in the box and so sets its height; the tumbleweed and
            wind are pinned to it in percentages. Everything therefore scales together,
            so the scene never overflows onto the headings on narrow viewports.
        */
        .error-404 .main-image {
            position: relative;
            max-width: 419px;
            width: 75%;
            display: block;
            margin: 0 auto 24px;
        }

        .error-404 .not-found {
            display: block;
            width: 100%;
            height: auto;
        }

        .error-404 .weed, .error-404 .wind {
            position: absolute;
            height: auto;
        }

        .error-404 .weed {
            width: 18.3%;
            bottom: 21.9%;
            right: 4.8%;
            animation: errorTumbleweed 4s infinite 2s;
            opacity: .3;
        }

        .error-404 .wind {
            width: 18%;
            bottom: 15.3%;
            right: -14.4%;
        }

        .error-404 h1, .error-404 h2 {
            color: #63666a;
            font-weight: 100;
        }

        .error-404 h1 {
            font-size: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid #DDD;
            margin-bottom: 24px;
        }

        .error-404 h2 {
            font-size: 26px;
            margin-bottom: 24px;
        }

        .error-404 p {
            margin-bottom: 24px;
            /* 200 is the floor of the Outfit variable range declared in _ErrorPageStyles; a lighter
               value clamps to 200 there but renders true Thin in the sans-serif fallback. */
            font-weight: 200;
        }

        .error-404 .assistance {
            margin-top: 32px;
            font-size: 14px;
        }

        /*
            Hex literals rather than styleguide variables: this view is Layout = null with inline
            CSS so it still renders when the asset pipeline is degraded. These are the
            loopnet-styleguide light-mode $text-link / $text-link-pressed values verbatim —
            6.8:1 and 10.2:1 on white, both clearing the WCAG AA 4.5:1 minimum for 14px text.

            Underlined by default, not only on hover: the link sits mid-sentence and reaches just
            1.18:1 against the surrounding body text, so colour alone would not mark it as a link.
        */
        .error-404 .assistance a {
            color: #0559B3;
            text-decoration: underline;
        }

        .error-404 .assistance a:hover, .error-404 .assistance a:active {
            color: #034082;
        }

        .error-404 .assistance a:focus-visible {
            outline: 2px solid #0559B3;
            outline-offset: 2px;
        }

        .error-404 .button {
            display: inline-block;
            padding: 0.7rem 1.875rem 0.8rem 1.875rem;
            background-color: #cf0000;
            color: #fff;
            text-decoration: none;
            font-weight: 400;
            border-radius: 2px;
            transition: background-color 0.13s ease-in-out;
        }

        .error-404 .button:hover {
            background-color: #961e00;
        }

        .error-404 .button:active {
            background-color: #721700;
        }

        @keyframes errorTumbleweed {
            0% {
                transform: translate(0, 0) rotate(360deg);
                opacity: .3;
            }

            25% {
                transform: translate(0, 0) rotate(360deg);
                opacity: 1;
            }

            100% {
                /* Relative to the tumbleweed's own width so the roll scales with the scene. */
                transform: translate(-171%, 0) rotate(0deg);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .error-404 .wrap {
                padding: 24px 8px;
            }

            .error-404 .main-image {
                max-width: 291px;
            }

            .error-404 h1 {
                font-size: 24px;
            }

            .error-404 h2 {
                font-size: 20px;
            }
        }
    </style>
